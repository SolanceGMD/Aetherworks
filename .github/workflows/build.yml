name: Aetherworks CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Aetherworks/Aetherworks.csproj
      - name: Build
        run: dotnet build Aetherworks/Aetherworks.csproj --configuration Release --no-restore
      - name: Publish self-contained launcher
        run: dotnet publish Aetherworks/Aetherworks.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: Aetherworks-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30